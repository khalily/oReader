[project]
name = "oreader-converter"
version = "0.1.0"
description = "PDF to Markdown converter gRPC service for oReader"
requires-python = ">=3.11"
dependencies = [
    "grpcio~=1.60.0",
    "grpcio-tools~=1.60.0",
    "magic-pdf[full]>=1.0.1",
    "openai>=1.0.0",
    "python-dotenv~=1.0.0",
]

[dependency-groups]
dev = [
    "pytest~=8.3.0",
    "ruff>=0.4.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.uv]
prerelease = "allow"

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true
