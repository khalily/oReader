# =============================================================================
# oReader Docker Compose - Unified Configuration
# =============================================================================
# Usage:
#   Development:  docker compose up
#   Production:   docker compose --profile prod up -d
#   Test:         docker compose --profile test up --abort-on-container-exit
#   With tools:   docker compose --profile tools up phpmyadmin
# =============================================================================

services:
  # ===========================================================================
  # Backend: Go API server (development with hot-reload)
  # ===========================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: development
    container_name: oreader-backend
    ports:
      - "0.0.0.0:${PORT:-8080}:8080"
    environment:
      ENV: ${ENV:-development}
      DATABASE_URL: mysql://oreader:${OREADER_DB_PASSWORD:-oreader}@db:3306/oreader?parseTime=true
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      FRONTEND_URL: http://${HOST_IP:-localhost}:5173
      PAPER_GRPC_ADDR: converter:50051
      PAPER_UPLOAD_DIR: /data/uploads/papers
      PAPER_MAX_UPLOAD_SIZE: ${PAPER_MAX_UPLOAD_SIZE:-52428800}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    volumes:
      - .:/src
      - go-module-cache:/root/go/pkg/mod
      - dev-uploads:/data/uploads
    working_dir: /src
    command: >
      air
      --build.cmd "go build -tags noembed -o /tmp/oreader ./cmd/server"
      --build.bin "/tmp/oreader"
      --build.delay "1000"
    depends_on:
      db:
        condition: service_healthy
      converter:
        condition: service_started
        required: false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - oreader-net

  # ===========================================================================
  # Frontend: React Vite dev server
  # ===========================================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: frontend-dev
    container_name: oreader-frontend
    ports:
      - "0.0.0.0:${FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_API_TARGET: http://backend:8080
    volumes:
      - ./web:/web
      - /web/node_modules
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - oreader-net

  # ===========================================================================
  # Converter: Python gRPC paper conversion service
  # ===========================================================================
  converter:
    build:
      context: ./converter
      dockerfile: Dockerfile
    container_name: oreader-converter
    ports:
      - "0.0.0.0:${GRPC_PORT:-50051}:50051"
    environment:
      GRPC_PORT: "50051"
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
    volumes:
      - converter-model-cache:/root/.cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.settimeout(5); s.connect(('localhost', 50051)); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - oreader-net

  # ===========================================================================
  # Database: MySQL 9.0 (all environments)
  # ===========================================================================
  db:
    image: mysql:9.0
    container_name: oreader-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: oreader
      MYSQL_USER: oreader
      MYSQL_PASSWORD: ${OREADER_DB_PASSWORD:-oreader}
    ports:
      - "0.0.0.0:${DB_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - oreader-net

  # ===========================================================================
  # Production backend: single binary with embedded frontend
  # ===========================================================================
  backend-prod:
    build:
      context: .
      dockerfile: Dockerfile
    image: oreader:latest
    container_name: oreader-backend-prod
    ports:
      - "0.0.0.0:${PORT:-8080}:8080"
    environment:
      ENV: production
      DATABASE_URL: mysql://oreader:${OREADER_DB_PASSWORD:-oreader}@db:3306/oreader?parseTime=true
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PAPER_GRPC_ADDR: converter:50051
      PAPER_UPLOAD_DIR: /data/uploads/papers
      PAPER_MAX_UPLOAD_SIZE: ${PAPER_MAX_UPLOAD_SIZE:-52428800}
    volumes:
      - prod-uploads:/data
    depends_on:
      db:
        condition: service_healthy
      converter:
        condition: service_started
        required: false
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - oreader-net
    profiles:
      - prod

  # ===========================================================================
  # Test backend: runs Go tests against MySQL
  # ===========================================================================
  backend-test:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: development
    container_name: oreader-test
    environment:
      ENV: testing
      DATABASE_URL: mysql://oreader:${OREADER_DB_PASSWORD:-oreader}@db:3306/oreader_test?parseTime=true
      TEST_DATABASE_URL: oreader:${OREADER_DB_PASSWORD:-oreader}@tcp(db:3306)/oreader_test?charset=utf8mb4&parseTime=True&loc=Local
      JWT_SECRET_KEY: test-jwt-secret-for-testing-minimum-32-characters
      PORT: "8080"
      LOG_LEVEL: debug
      PAPER_GRPC_ADDR: converter:50051
    volumes:
      - .:/src
      - go-module-cache:/root/go/pkg/mod
    working_dir: /src
    command: ["go", "test", "-v", "-race", "./internal/..."]
    depends_on:
      db:
        condition: service_healthy
      converter:
        condition: service_started
    networks:
      - oreader-net
    profiles:
      - test

  # ===========================================================================
  # Tools: phpMyAdmin (optional)
  # ===========================================================================
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: oreader-phpmyadmin
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
    ports:
      - "0.0.0.0:${PMA_PORT:-8081}:80"
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - oreader-net
    profiles:
      - tools

  # ===========================================================================
  # Redis: distributed rate limiting (optional, prod)
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: oreader-redis
    ports:
      - "0.0.0.0:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes
    networks:
      - oreader-net
    profiles:
      - prod

# =============================================================================
# Volumes
# =============================================================================
volumes:
  mysql-data:
    driver: local
  go-module-cache:
    driver: local
  dev-uploads:
    driver: local
  prod-uploads:
    driver: local
  converter-model-cache:
    driver: local
  redis-data:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  oreader-net:
    driver: bridge
