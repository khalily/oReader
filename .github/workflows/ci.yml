name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =============================================================================
  # Backend: Lint
  # =============================================================================
  backend-lint:
    name: "Backend: Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Download Go modules
        run: go mod download

      - name: Go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

  # =============================================================================
  # Backend: Test (requires MySQL)
  # =============================================================================
  backend-test:
    name: "Backend: Test"
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:9.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: oreader_test
          MYSQL_USER: oreader
          MYSQL_PASSWORD: oreader
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -prootpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=30s
    env:
      TEST_DATABASE_URL: "oreader:oreader@tcp(127.0.0.1:3306)/oreader_test?charset=utf8mb4&parseTime=True&loc=Local"
      TEST_JWT_SECRET: "test-jwt-secret-for-ci-must-be-32-characters"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y mysql-client

      - name: Run database migrations
        run: |
          for f in migrations/*.up.sql; do
            echo "Applying $f..."
            mysql -h 127.0.0.1 -u root -prootpassword oreader_test < "$f"
          done

      - name: Run Go tests
        run: |
          mkdir -p coverage
          go test -v -race -coverprofile=coverage/coverage.out -covermode=atomic ./internal/...

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go-coverage
          path: coverage/coverage.out

  # =============================================================================
  # Frontend: Lint
  # =============================================================================
  frontend-lint:
    name: "Frontend: Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: ESLint
        working-directory: web
        run: npm run lint

  # =============================================================================
  # Frontend: Test
  # =============================================================================
  frontend-test:
    name: "Frontend: Test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Run Vitest
        working-directory: web
        run: npm test -- --run --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: web/coverage/

  # =============================================================================
  # Frontend: Build
  # =============================================================================
  frontend-build:
    name: "Frontend: Build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: TypeScript check + Vite build
        working-directory: web
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: web/dist/
          retention-days: 1

  # =============================================================================
  # Converter: Lint
  # =============================================================================
  converter-lint:
    name: "Converter: Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install lint tools
        run: pip install flake8 black

      - name: Run flake8
        run: flake8 converter/ --max-line-length=120 --exclude=converter/proto/,converter/__pycache__

      - name: Check black formatting
        run: black --check --line-length=120 converter/ --exclude '(proto|__pycache__)'

  # =============================================================================
  # Converter: Test
  # =============================================================================
  converter-test:
    name: "Converter: Test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: converter/requirements.txt

      - name: Install test dependencies
        run: pip install pytest grpcio grpcio-tools

      - name: Run converter tests
        run: cd converter && python -m pytest tests/ -v --tb=short

  # =============================================================================
  # Docker: Build (validates production multi-stage build)
  # =============================================================================
  docker-build:
    name: "Docker: Build"
    runs-on: ubuntu-latest
    needs: [frontend-build]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: oreader:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify binary runs
        run: docker run --rm oreader:ci-test --help || true

  # =============================================================================
  # Security: Scan
  # =============================================================================
  security-scan:
    name: "Security: Scan"
    runs-on: ubuntu-latest
    needs: [backend-lint]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: '1.25'
          repo-path: .

      - name: npm audit
        working-directory: web
        run: |
          npm ci
          npm audit --audit-level=high
        continue-on-error: true
