# air.toml - Hot reload configuration for development
root = "."
tmp_dir = "/tmp"

[build]
  cmd = "go build -o /tmp/oreader ./cmd/server"
  bin = "/tmp/oreader"
  include_ext = ["go"]
  exclude_ext = ["_test.go"]
  include_dir = []
  exclude_dir = ["build", "coverage", ".git"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = false
  follow_symlink = false
  full_bin = ""
  args_bin = []
  send_interrupt = true
  kill_delay = "5s"

[log]
  time = true
  main_only = false

[color]
  main = "muted"
  watcher = "muted"
  build = "muted"
  runner = "muted"

[misc]
  clean_on_exit = false

[screen]
  clear_on_rebuild = false
  keep_scroll = true
