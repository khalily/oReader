# Docker Compose for Production
# Usage: docker-compose -f docker-compose.prod.yml up -d
#
# This configuration:
# - Uses the production Dockerfile (single binary with embedded frontend)
# - Runs with MySQL database
# - Includes proper health checks and restart policies
# - Uses secrets management for sensitive values

services:
  oreader:
    build:
      context: .
      dockerfile: Dockerfile
    image: oreader:latest
    container_name: oreader-prod
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - ENV=production
      - DATABASE_URL=mysql://oreader:${OREADER_DB_PASSWORD}@db:3306/oreader?parseTime=true
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - PORT=8080
      # Optional: Rate limiting with Redis
      # RATE_LIMIT_REDIS_URL=redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - oreader-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    # Read-only root filesystem for security
    read_only: true
    tmpfs:
      - /tmp

  db:
    image: mysql:9.0
    container_name: oreader-mysql-prod
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: oreader
      MYSQL_USER: oreader
      MYSQL_PASSWORD: ${OREADER_DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./migrations:/docker-entrypoint-initdb.d:ro
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - oreader-network
    command: --default-authentication-plugin=mysql_native_password
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  # Optional: Redis for distributed rate limiting
  redis:
    image: redis:7-alpine
    container_name: oreader-redis-prod
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - oreader-network
    command: redis-server --appendonly yes
    profiles:
      - redis
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # Optional: Nginx reverse proxy for TLS termination
  nginx:
    image: nginx:alpine
    container_name: oreader-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - oreader
    restart: always
    networks:
      - oreader-network
    profiles:
      - nginx

volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local

networks:
  oreader-network:
    driver: bridge
